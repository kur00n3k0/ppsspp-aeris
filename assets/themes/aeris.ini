# AERIS: the XMB look. Pick it in Settings > System > Theme, with the main menu layout set to XMB.
# Colors are "#RRGGBBAA". The Xmb* keys are optional and only read by the XMB layout and the XMB ribbon
# background; themes without them use ItemFocusedStyleBg, ItemDownStyleBg and BackgroundColor instead.

[AerisAqua]
Name = "AERIS Aqua"
BackgroundColor = "#03202FFF"
ScrollbarColor = "#FFFFFF80"
ItemStyleFg = "#EAF7FCFF"
ItemStyleBg = "#FFFFFF0E"
ItemFocusedStyleFg = "#FFFFFFFF"
ItemFocusedStyleBg = "#FFFFFF33"
ItemDownStyleFg = "#022231FF"
ItemDownStyleBg = "#3EE6FFFF"
ItemDisabledStyleFg = "#EEEEEE80"
ItemDisabledStyleBg = "#00000055"
HeaderStyleFg = "#FFFFFFFF"
HeaderStyleBg = "#00000000"
CollapsibleHeaderStyleFg = "#FFFFFFFF"
CollapsibleHeaderStyleBg = "#FFFFFF12"
InfoStyleFg = "#9DBDCBFF"
InfoStyleBg = "#00000000"
TooltipStyleFg = "#FFFFFFFF"
TooltipStyleBg = "#10324AF5"
PopupStyleFg = "#FFFFFFFF"
PopupStyleBg = "#082232F7"
PopupTitleStyleFg = "#3EE6FFFF"
PopupTitleStyleBg = "#00000000"
PopupSliderColor = "#FFFFFFFF"
PopupSliderFocusedColor = "#3EE6FFFF"
XmbAccent = "#3EE6FFFF"
XmbAccent2 = "#1E8CFFFF"
XmbBgTop = "#05324AFF"
XmbBgBottom = "#020F19FF"

